name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project ios/AFGAPPLETM.xcodeproj \
            -scheme AFGAPPLETM \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath ./build/AFGAPPLETM.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ./build/AFGAPPLETM.xcarchive/Products/Applications/AFGAPPLETM.app Payload/
          zip -r AFGAPPLETM-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AFGAPPLETM-unsigned
          path: AFGAPPLETM-unsigned.ipa
          retention-days: 30
